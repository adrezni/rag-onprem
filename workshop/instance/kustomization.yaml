apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- includeSelectors: false
  pairs:
    component: workshop

namespace: user0

resources:
# - notebook.yaml
# - pvc.yaml
- quota.yaml
- ns-rb-admin.yaml
- ns-rb-view.yaml
- ns.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: user0
    target:
      kind: Job
      name: data-connection-setup
